<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="solid" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#2c3140"/>
      <line x1="0" y1="6" x2="6" y2="0" stroke="#4a5167" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d35e2a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#f7f7f8"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#202632">Fig. 1 — Occupancy grid: plan view and resulting wall slices</text>

  <!-- left: plan view -->
  <g transform="translate(20,40)">
    <text x="160" y="-6" text-anchor="middle" font-size="11" fill="#555">Plan view</text>
    <!-- grid 8x8 cells of 40px -->
    <g stroke="#c8ccd4" stroke-width="0.6" fill="none">
      <path d="M0,0 H320 M0,40 H320 M0,80 H320 M0,120 H320 M0,160 H320 M0,200 H320 M0,240 H320 M0,280 H320 M0,320 H320"/>
      <path d="M0,0 V320 M40,0 V320 M80,0 V320 M120,0 V320 M160,0 V320 M200,0 V320 M240,0 V320 M280,0 V320 M320,0 V320"/>
    </g>
    <!-- solid blocks -->
    <g fill="url(#solid)" stroke="#3a4054" stroke-width="0.5">
      <rect x="0"   y="0"   width="320" height="40"/>
      <rect x="0"   y="280" width="320" height="40"/>
      <rect x="0"   y="40"  width="40"  height="240"/>
      <rect x="280" y="40"  width="40"  height="240"/>
      <rect x="120" y="120" width="80"  height="40"/>
      <rect x="200" y="200" width="40"  height="40"/>
    </g>
    <!-- camera -->
    <g transform="translate(80,200)">
      <circle r="8" fill="#206ac7" stroke="white" stroke-width="2"/>
      <text x="0" y="-14" text-anchor="middle" font-size="10" fill="#206ac7" font-weight="600">camera</text>
      <!-- FOV -->
      <path d="M0,0 L220,-70 L220,70 z" fill="#206ac7" fill-opacity="0.10" stroke="#206ac7" stroke-width="0.6" stroke-dasharray="3,3"/>
      <!-- sample rays -->
      <g stroke="#d35e2a" stroke-width="0.9" marker-end="url(#arrow)" fill="none" opacity="0.85">
        <line x1="0" y1="0" x2="160" y2="-50"/>
        <line x1="0" y1="0" x2="180" y2="-22"/>
        <line x1="0" y1="0" x2="200" y2="0"/>
        <line x1="0" y1="0" x2="180" y2="22"/>
        <line x1="0" y1="0" x2="160" y2="50"/>
      </g>
    </g>
    <text x="240" y="200" text-anchor="middle" font-size="9" fill="#d35e2a">rays</text>
  </g>

  <!-- arrow between -->
  <g transform="translate(360,200)">
    <path d="M0,-20 L24,-20 L24,-30 L48,0 L24,30 L24,20 L0,20 z" fill="#888"/>
    <text x="24" y="-40" text-anchor="middle" font-size="10" fill="#555">cast &amp; project</text>
  </g>

  <!-- right: column-strip view -->
  <g transform="translate(420,40)">
    <text x="140" y="-6" text-anchor="middle" font-size="11" fill="#555">Perspective view — one strip per ray</text>
    <rect x="0" y="0" width="280" height="320" fill="#1a2030"/>
    <!-- horizon -->
    <line x1="0" y1="160" x2="280" y2="160" stroke="#3a4458" stroke-width="0.8" stroke-dasharray="4,4"/>
    <!-- wall strips of varying heights -->
    <g fill="#8a5a3a" stroke="#5d3c25" stroke-width="0.4">
      <rect x="0"   y="60"  width="20" height="200"/>
      <rect x="20"  y="70"  width="20" height="180"/>
      <rect x="40"  y="80"  width="20" height="160"/>
      <rect x="60"  y="92"  width="20" height="136"/>
      <rect x="80"  y="100" width="20" height="120"/>
      <rect x="100" y="105" width="20" height="110"/>
      <rect x="120" y="100" width="20" height="120"/>
      <rect x="140" y="92"  width="20" height="136"/>
      <rect x="160" y="80"  width="20" height="160"/>
      <rect x="180" y="70"  width="20" height="180"/>
      <rect x="200" y="60"  width="20" height="200"/>
      <rect x="220" y="50"  width="20" height="220"/>
      <rect x="240" y="40"  width="20" height="240"/>
      <rect x="260" y="30"  width="20" height="260"/>
    </g>
    <!-- ceiling/floor wash -->
    <rect x="0" y="0"   width="280" height="30"  fill="#373d52" opacity="0.6"/>
    <rect x="0" y="290" width="280" height="30"  fill="#3a3530" opacity="0.6"/>
    <text x="6" y="14" font-size="9" fill="#a8b0c4">ceiling</text>
    <text x="6" y="316" font-size="9" fill="#c4a890">floor</text>
  </g>
</svg>
