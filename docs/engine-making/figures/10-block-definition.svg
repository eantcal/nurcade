<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="brick" patternUnits="userSpaceOnUse" width="20" height="10">
      <rect width="20" height="10" fill="#8a5a3a"/>
      <path d="M0,5 H20 M10,0 V5 M0,10 V5" stroke="#5d3c25" stroke-width="0.6"/>
    </pattern>
    <pattern id="grate" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#a8c0d0" fill-opacity="0.3"/>
      <line x1="0" y1="0" x2="10" y2="0" stroke="#406070" stroke-width="0.8"/>
      <line x1="0" y1="5" x2="10" y2="5" stroke="#406070" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0"  y2="10" stroke="#406070" stroke-width="0.8"/>
      <line x1="5" y1="0" x2="5"  y2="10" stroke="#406070" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="720" height="420" fill="#f7f7f8"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#202632">Fig. 10 — A BlockDefinition: per-cell floor, ceiling, and stacked wall spans</text>

  <!-- left: side view of a block -->
  <g transform="translate(60,60)">
    <text x="160" y="-12" text-anchor="middle" font-size="11" fill="#444" font-weight="600">Block "05" (transparent corridor) — side view</text>
    <!-- world frame -->
    <rect x="0" y="0" width="320" height="280" fill="#1a2030" stroke="#444"/>
    <!-- floor surface band -->
    <rect x="0" y="265" width="320" height="15" fill="#3a2618"/>
    <text x="6" y="278" font-size="9" fill="#dcc9a8">floor: tex "09", height 0</text>
    <!-- ceiling band -->
    <rect x="0" y="0" width="320" height="15" fill="#5a3a30"/>
    <text x="6" y="11" font-size="9" fill="#fff">ceiling: tex "05", height 512</text>
    <!-- transparent lower span -->
    <rect x="40" y="160" width="240" height="105" fill="url(#grate)"/>
    <text x="50" y="220" font-size="10" fill="#fff" font-weight="600">span 2: transparent</text>
    <text x="50" y="236" font-size="10" fill="#fff">tex "03", 0–512, collision=false</text>
    <!-- solid upper span -->
    <rect x="40" y="15" width="240" height="145" fill="url(#brick)"/>
    <text x="50" y="60" font-size="10" fill="#fff" font-weight="600">span 1: solid</text>
    <text x="50" y="76" font-size="10" fill="#fff">tex "05", 512–1024, collision=true</text>
    <!-- y axis label -->
    <g transform="translate(-30,140)" font-size="9" fill="#666">
      <text>height</text>
      <text y="14">↑</text>
      <text y="160">0</text>
    </g>
  </g>

  <!-- right: JSON snippet -->
  <g transform="translate(400,60)">
    <text x="160" y="-12" text-anchor="middle" font-size="11" fill="#444" font-weight="600">JSON</text>
    <rect width="280" height="280" fill="#202632" stroke="#444"/>
    <g font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#e8edf5">
      <text x="10" y="20">"05": {</text>
      <text x="10" y="36">  "name": "transparent_corridor",</text>
      <text x="10" y="52">  "floor":   {"texture":"09","height":0},</text>
      <text x="10" y="68">  "ceiling": {"texture":"05","height":512},</text>
      <text x="10" y="84">  "walls": [</text>
      <text x="10" y="100">    { "kind": "solid",</text>
      <text x="10" y="116">      "texture": "05",</text>
      <text x="10" y="132">      "bottom": 512, "top": 1024,</text>
      <text x="10" y="148">      "collision": true },</text>
      <text x="10" y="166">    { "kind": "transparent",</text>
      <text x="10" y="182">      "texture": "03",</text>
      <text x="10" y="198">      "bottom": 0,   "top": 512,</text>
      <text x="10" y="214">      "collision": false }</text>
      <text x="10" y="230">  ]</text>
      <text x="10" y="246">}</text>
    </g>
  </g>
</svg>
