<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="720" height="320" fill="#f7f7f8"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#202632">Fig. 16 — Lookup-table angle space: ray is an integer index</text>

  <!-- left: circular table -->
  <g transform="translate(170,180)">
    <circle r="100" fill="none" stroke="#aab" stroke-width="0.8"/>
    <!-- tick marks every 30 deg -->
    <g stroke="#aab" stroke-width="0.6">
      <line x1="100" y1="0"  x2="106" y2="0"/>
      <line x1="-100" y1="0" x2="-106" y2="0"/>
      <line x1="0" y1="100"  x2="0" y2="106"/>
      <line x1="0" y1="-100" x2="0" y2="-106"/>
    </g>
    <g font-size="10" fill="#444">
      <text x="116" y="4">deg0 / deg360 = 1919</text>
      <text x="0" y="-116" text-anchor="middle">deg270 = 1439</text>
      <text x="-116" y="4" text-anchor="end">deg180 = 959</text>
      <text x="0" y="124" text-anchor="middle">deg90 = 479</text>
    </g>
    <!-- pie slice of FOV -->
    <path d="M0,0 L100,0 A100,100 0 0,1 70.7,70.7 Z" fill="#206ac7" fill-opacity="0.18" stroke="#206ac7" stroke-width="0.8"/>
    <text x="38" y="34" font-size="10" fill="#206ac7" font-weight="600">FOV slice</text>
    <text x="38" y="48" font-size="9" fill="#206ac7">= xProjRes rays</text>
    <!-- camera -->
    <circle r="4" fill="#206ac7"/>
  </g>

  <!-- right: derivation -->
  <g transform="translate(340,55)" font-size="11" fill="#222">
    <text x="0" y="0" font-weight="600">Tables built once in Player::Player</text>
    <text x="0" y="20" font-family="ui-monospace,Consolas,monospace" font-size="11">
      vecSize = xProjRes · (360 / visualDeg)
    </text>
    <text x="0" y="36" font-family="ui-monospace,Consolas,monospace" font-size="11">
      // 320 columns · 60° FOV  →  vecSize = 1920
    </text>
    <text x="0" y="62" font-weight="600">Cardinal indices</text>
    <text x="0" y="82" font-family="ui-monospace,Consolas,monospace" font-size="11">
      deg90  = vecSize / 4
    </text>
    <text x="0" y="98" font-family="ui-monospace,Consolas,monospace" font-size="11">
      deg180 = vecSize / 2
    </text>
    <text x="0" y="114" font-family="ui-monospace,Consolas,monospace" font-size="11">
      deg270 = (vecSize · 3) / 4
    </text>
    <text x="0" y="130" font-family="ui-monospace,Consolas,monospace" font-size="11">
      deg360 = vecSize − 1
    </text>
    <text x="0" y="156" font-weight="600">Per-ray storage</text>
    <text x="0" y="176" font-family="ui-monospace,Consolas,monospace" font-size="11">
      sin[ray]  cos[ray]  tan[ray]
    </text>
    <text x="0" y="192" font-family="ui-monospace,Consolas,monospace" font-size="11">
      invsin[]  invcos[]  invtan[]
    </text>
    <text x="0" y="216" font-size="11" fill="#666">
      Reciprocals replace runtime divisions with one LUT read.
    </text>
    <text x="0" y="232" font-size="11" fill="#666">
      Values near zero saturate to POSITIVE_INFINITY: no zero check needed.
    </text>
  </g>
</svg>
