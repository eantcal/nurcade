<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="shadeGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"   stop-color="#d3a370"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
  </defs>
  <rect width="720" height="280" fill="#f7f7f8"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#202632">Fig. 5 — Depth shading: each colour channel multiplied by depth_par ∈ [0, 1]</text>

  <!-- corridor render -->
  <g transform="translate(60,50)">
    <rect width="600" height="200" fill="#1a2030"/>
    <!-- floor -->
    <polygon points="0,200 600,200 460,120 140,120" fill="#3a2e22"/>
    <!-- ceiling -->
    <polygon points="0,0 600,0 460,80 140,80" fill="#272d3a"/>
    <!-- horizon line -->
    <line x1="140" y1="100" x2="460" y2="100" stroke="#5a6478" stroke-width="0.7" stroke-dasharray="3,3"/>
    <!-- side walls with shading via gradients -->
    <polygon points="0,0 140,80 140,120 0,200" fill="url(#shadeGrad)" transform="translate(0,0)"/>
    <g transform="translate(600,0) scale(-1,1)">
      <polygon points="0,0 140,80 140,120 0,200" fill="url(#shadeGrad)"/>
    </g>
    <!-- far wall -->
    <rect x="140" y="80" width="320" height="40" fill="#3a2618"/>

    <!-- depth scale -->
    <g transform="translate(0,225)">
      <line x1="0" y1="0" x2="600" y2="0" stroke="#888"/>
      <text x="0"   y="14" font-size="10" fill="#444">near (depth_par ≈ 1)</text>
      <text x="600" y="14" font-size="10" fill="#444" text-anchor="end">far (depth_par → 0)</text>
    </g>
  </g>
</svg>
