<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="720" height="280" fill="#f7f7f8"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#202632">Fig. 11 — Mip mapping: pick a sprite resolution from the distance LOD table</text>

  <g transform="translate(40,55)" font-size="10" fill="#444">
    <!-- distance axis -->
    <line x1="0" y1="120" x2="640" y2="120" stroke="#888"/>
    <g>
      <line x1="0"   y1="114" x2="0"   y2="126" stroke="#888"/>
      <line x1="100" y1="114" x2="100" y2="126" stroke="#888"/>
      <line x1="220" y1="114" x2="220" y2="126" stroke="#888"/>
      <line x1="380" y1="114" x2="380" y2="126" stroke="#888"/>
      <line x1="540" y1="114" x2="540" y2="126" stroke="#888"/>
      <line x1="640" y1="114" x2="640" y2="126" stroke="#888"/>
    </g>
    <text x="0"   y="145">0</text>
    <text x="100" y="145">1.5 cells</text>
    <text x="220" y="145">3 cells</text>
    <text x="380" y="145">6 cells</text>
    <text x="540" y="145">12 cells</text>
    <text x="640" y="145">∞</text>

    <!-- resolution bands -->
    <g>
      <rect x="0"   y="60" width="100" height="50" fill="#bccfe2"/>
      <text x="50"  y="92" text-anchor="middle">256 px</text>
      <rect x="100" y="60" width="120" height="50" fill="#a3b8d4"/>
      <text x="160" y="92" text-anchor="middle">128 px</text>
      <rect x="220" y="60" width="160" height="50" fill="#88a0bf"/>
      <text x="300" y="92" text-anchor="middle">64 px</text>
      <rect x="380" y="60" width="160" height="50" fill="#6e89a8"/>
      <text x="460" y="92" text-anchor="middle">32 px</text>
      <rect x="540" y="60" width="100" height="50" fill="#586d8a"/>
      <text x="590" y="92" text-anchor="middle">16 px</text>
    </g>
    <text x="0" y="48" font-weight="600" fill="#202632">SpriteSet::resolutionForDistance(distance_cells)</text>

    <!-- example sprite sizes -->
    <g transform="translate(0,170)">
      <rect x="0"  y="0" width="64" height="64" fill="#1a2030"/>
      <text x="32" y="78" text-anchor="middle">256 (full)</text>
      <rect x="120" y="16" width="48" height="48" fill="#1a2030"/>
      <text x="144" y="78" text-anchor="middle">128</text>
      <rect x="240" y="28" width="32" height="32" fill="#1a2030"/>
      <text x="256" y="78" text-anchor="middle">64</text>
      <rect x="380" y="40" width="20" height="20" fill="#1a2030"/>
      <text x="390" y="78" text-anchor="middle">32</text>
      <rect x="540" y="48" width="12" height="12" fill="#1a2030"/>
      <text x="546" y="78" text-anchor="middle">16</text>
    </g>
  </g>
</svg>
