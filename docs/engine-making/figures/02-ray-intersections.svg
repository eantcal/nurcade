<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d35e2a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#f7f7f8"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#202632">Fig. 2 — Horizontal and vertical intersections of a ray with the grid</text>

  <g transform="translate(60,50)">
    <!-- grid 7x6 cells of 80px -->
    <g stroke="#c8ccd4" stroke-width="0.7" fill="none">
      <path d="M0,0 H560 M0,80 H560 M0,160 H560 M0,240 H560 M0,320 H560"/>
      <path d="M0,0 V320 M80,0 V320 M160,0 V320 M240,0 V320 M320,0 V320 M400,0 V320 M480,0 V320 M560,0 V320"/>
    </g>

    <!-- labels for grid lines -->
    <g font-size="9" fill="#999">
      <text x="-12" y="84">y=k·Dy</text>
      <text x="-12" y="164">y</text>
      <text x="-12" y="244">y</text>
      <text x="80"  y="335" text-anchor="middle">x=k·Dx</text>
    </g>

    <!-- camera origin -->
    <g transform="translate(60,260)">
      <circle r="6" fill="#206ac7" stroke="white" stroke-width="2"/>
      <text x="-8" y="-12" font-size="10" fill="#206ac7" font-weight="600">P (xp, yp)</text>
    </g>

    <!-- ray -->
    <line x1="60" y1="260" x2="500" y2="40" stroke="#d35e2a" stroke-width="1.4" marker-end="url(#arrow2)"/>
    <text x="450" y="60" font-size="11" fill="#d35e2a" font-weight="600">ray (angle θ)</text>

    <!-- vertical intersections (with x = k·Dx lines) -->
    <g fill="#0a8a4a">
      <circle cx="160" cy="210" r="4"/>
      <circle cx="240" cy="170" r="4"/>
      <circle cx="320" cy="130" r="4"/>
      <circle cx="400" cy="90"  r="4"/>
      <circle cx="480" cy="50"  r="4"/>
    </g>
    <text x="160" y="200" font-size="9" fill="#0a8a4a">V₁</text>
    <text x="240" y="160" font-size="9" fill="#0a8a4a">V₂</text>
    <text x="320" y="120" font-size="9" fill="#0a8a4a">V₃</text>
    <text x="400" y="80"  font-size="9" fill="#0a8a4a">V₄</text>

    <!-- horizontal intersections (with y = k·Dy lines) -->
    <g fill="#8a3a2a">
      <circle cx="120" cy="240" r="4"/>
      <circle cx="280" cy="160" r="4"/>
      <circle cx="440" cy="80"  r="4"/>
    </g>
    <text x="106" y="256" font-size="9" fill="#8a3a2a">H₁</text>
    <text x="266" y="176" font-size="9" fill="#8a3a2a">H₂</text>
    <text x="424" y="96"  font-size="9" fill="#8a3a2a">H₃</text>

    <!-- formula box -->
    <g transform="translate(0, 360)">
      <rect x="-6" y="-14" width="560" height="42" fill="#fff" stroke="#d0d4dc"/>
      <text x="6" y="2" font-size="11" fill="#222" font-weight="600">For each candidate intersection along the ray:</text>
      <text x="6" y="18" font-size="11" fill="#444" font-family="ui-monospace,Consolas,monospace">  V: x = k·Dx,  y = yp + tan(θ)·(x − xp)         dist_V = (x − xp)·invcos(θ)</text>
    </g>
  </g>
</svg>
